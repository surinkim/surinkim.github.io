<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="619" rx="8" fill="#ffffff" stroke="#e6e6e6"/>
  <text x="24" y="38" font-size="17" font-weight="700" fill="#1f1f1f">GPU 파드가 Pending에 머무는 이유: 두 제어 루프의 어긋남</text>
  <text x="24" y="58" font-size="12" fill="#8a8a8a">스케줄러는 있는 노드에 놓고, 오토스케일러는 자리가 없으면 노드를 늘린다. 둘이 노드 모양을 다르게 보면 생기는 일</text>

  <!-- scenario 1 -->
  <text x="24" y="96" font-size="11" font-weight="600" fill="#9a9a9a">어긋남 1: 늘린 노드를 스케줄러가 쓰지 않는다</text>
  <line x1="24" y1="104" x2="736" y2="104" stroke="#e2e2e2"/>
  <g font-size="12">
    <rect x="24" y="122" width="150" height="50" fill="none" stroke="#1f1f1f" stroke-dasharray="4 3"/>
    <text x="36" y="142" fill="#1f1f1f">Pending 파드</text>
    <text x="36" y="160" font-size="11" fill="#5f5f5f">GPU + 같은 경로의 NIC</text>

    <text x="214" y="142" fill="#1f1f1f">오토스케일러</text>
    <text x="214" y="160" font-size="11" fill="#5f5f5f">"노드를 늘릴까?"에 답함</text>

    <rect x="392" y="122" width="130" height="50" fill="none" stroke="#9a9a9a"/>
    <text x="404" y="142" fill="#1f1f1f">새 GPU 노드</text>
    <text x="404" y="160" font-size="11" fill="#5f5f5f">요청과 모양이 다름</text>

    <text x="562" y="142" fill="#1f1f1f">스케줄러</text>
    <text x="562" y="160" font-size="11" fill="#5f5f5f">조건 불일치, 배치 안 함</text>
  </g>
  <g stroke="#9a9a9a" fill="none">
    <path d="M176,147 H206" marker-end="url(#a)"/>
    <path d="M354,147 H386" marker-end="url(#a)"/>
    <path d="M524,147 H554" marker-end="url(#a)"/>
  </g>
  <text x="24" y="196" font-size="11" fill="#5f5f5f">용량이 없는 게 아니라, 비싼 가속기가 놀고 파드는 계속 기다린다.</text>

  <!-- scenario 2: gang -->
  <text x="24" y="236" font-size="11" font-weight="600" fill="#9a9a9a">어긋남 2: 다 같이 놓거나 아예 놓지 않아야 하는 작업 (gang)</text>
  <line x1="24" y1="244" x2="736" y2="244" stroke="#e2e2e2"/>
  <g>
    <rect x="24" y="264" width="22" height="22" fill="#1f1f1f"/>
    <rect x="52" y="264" width="22" height="22" fill="#1f1f1f"/>
    <rect x="80" y="264" width="22" height="22" fill="#1f1f1f"/>
    <rect x="108" y="264" width="22" height="22" fill="none" stroke="#1f1f1f" stroke-dasharray="3 2"/>
    <rect x="136" y="264" width="22" height="22" fill="none" stroke="#1f1f1f" stroke-dasharray="3 2"/>
    <rect x="164" y="264" width="22" height="22" fill="none" stroke="#1f1f1f" stroke-dasharray="3 2"/>
    <rect x="192" y="264" width="22" height="22" fill="none" stroke="#1f1f1f" stroke-dasharray="3 2"/>
    <rect x="220" y="264" width="22" height="22" fill="none" stroke="#1f1f1f" stroke-dasharray="3 2"/>
  </g>
  <text x="24" y="306" font-size="10" fill="#9a9a9a">개념도: 칠한 칸은 노드를 받은 파드, 빈 칸은 대기 중인 파드</text>
  <g font-size="12">
    <text x="276" y="272" fill="#1f1f1f">오토스케일러는 파드 단위로 판단</text>
    <text x="276" y="290" font-size="11" fill="#5f5f5f">일부 파드 몫의 노드만 늘리고, 작업은 시작도 못 한 채 그 용량이 낭비된다</text>
  </g>

  <!-- matrix -->
  <text x="24" y="346" font-size="11" font-weight="600" fill="#9a9a9a">두 루프가 같은 것을 이해하는가</text>
  <line x1="24" y1="354" x2="736" y2="354" stroke="#e2e2e2"/>
  <g font-size="11" fill="#9a9a9a">
    <text x="264" y="374" text-anchor="middle">스케줄러</text>
    <text x="364" y="374" text-anchor="middle">오토스케일러</text>
    <text x="430" y="374">지금 상태</text>
  </g>
  <g font-size="12" fill="#1f1f1f">
    <text x="24" y="402">토폴로지 (GPU·NIC·NUMA 배치)</text>
    <circle cx="264" cy="398" r="6" fill="#0f7b6c"/>
    <path d="M364,392 a6,6 0 0,0 0,12 z" fill="#0f7b6c"/><circle cx="364" cy="398" r="6" fill="none" stroke="#0f7b6c"/>
    <text x="430" y="402" font-size="11" fill="#5f5f5f">DRA로 구조화된 요청 표현. 오토스케일러 지원은 구현마다 다름</text>

    <text x="24" y="432">GPU 하나를 쪼개 나눠 쓰기</text>
    <circle cx="264" cy="428" r="6" fill="#0f7b6c"/>
    <path d="M364,422 a6,6 0 0,0 0,12 z" fill="#0f7b6c"/><circle cx="364" cy="428" r="6" fill="none" stroke="#0f7b6c"/>
    <text x="430" y="432" font-size="11" fill="#5f5f5f">partitionable·consumable capacity. 역시 구현마다 다름</text>

    <text x="24" y="462">그룹 단위 배치 (gang)</text>
    <path d="M264,452 a6,6 0 0,0 0,12 z" fill="#0f7b6c"/><circle cx="264" cy="458" r="6" fill="none" stroke="#0f7b6c"/>
    <circle cx="364" cy="458" r="6" fill="none" stroke="#9a9a9a"/>
    <text x="430" y="462" font-size="11" fill="#5f5f5f">Workload·PodGroup API는 beta, 기본 꺼짐</text>
    <text x="430" y="478" font-size="11" fill="#5f5f5f">우회: Kueue + ProvisioningRequest로 그룹 용량을 한 번에 요청</text>

    <text x="24" y="508">아직 없는 노드까지 보고 배치</text>
    <circle cx="264" cy="504" r="6" fill="none" stroke="#9a9a9a"/>
    <circle cx="364" cy="504" r="6" fill="none" stroke="#9a9a9a"/>
    <text x="430" y="508" font-size="11" fill="#5f5f5f">SIG-Autoscaling에 두 루프를 잇는 API 제안</text>
  </g>
  <g font-size="10" fill="#9a9a9a">
    <circle cx="30" cy="534" r="4" fill="#0f7b6c"/><text x="40" y="537">지원</text>
    <path d="M90,530 a4,4 0 0,0 0,8 z" fill="#0f7b6c"/><circle cx="90" cy="534" r="4" fill="none" stroke="#0f7b6c"/><text x="100" y="537">일부·조건부</text>
    <circle cx="174" cy="534" r="4" fill="none" stroke="#9a9a9a"/><text x="184" y="537">아직</text>
  </g>

  <line x1="24" y1="558" x2="736" y2="558" stroke="#e2e2e2"/>
  <text x="24" y="584" font-size="12" fill="#1f1f1f">하드웨어 모델은 하나, 쓰는 쪽은 둘.</text>
  <text x="24" y="604" font-size="11" fill="#5f5f5f">GPU 파드가 Pending이면 용량 부족부터 의심하지 말고, 두 루프가 같은 노드 모양을 보고 있는지 확인한다.</text>
</svg>
