<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="559" rx="8" fill="#ffffff" stroke="#e6e6e6"/>
  <text x="24" y="38" font-size="17" font-weight="700" fill="#1f1f1f">OpenAI Agents SDK로 첫 에이전트: 한 단계에 하나씩</text>
  <text x="24" y="58" font-size="12" fill="#8a8a8a">리서치 비서 에이전트에 기능을 하나씩 붙여 가는 순서. 코드 이름은 원문 그대로</text>

  <text x="24" y="96" font-size="11" font-weight="600" fill="#9a9a9a">단계</text>
  <text x="210" y="96" font-size="11" font-weight="600" fill="#9a9a9a">추가하는 코드</text>
  <text x="520" y="96" font-size="11" font-weight="600" fill="#9a9a9a">에이전트가 할 수 있게 되는 것</text>
  <line x1="24" y1="104" x2="736" y2="104" stroke="#e2e2e2"/>

  <g font-size="12">
    <!-- 0 -->
    <circle cx="36" cy="132" r="9" fill="#ffffff" stroke="#b8b8b8"/>
    <text x="36" y="136" font-size="10" text-anchor="middle" fill="#5f5f5f">0</text>
    <text x="56" y="136" fill="#1f1f1f">설치</text>
    <text x="210" y="136" font-family="Menlo, Consolas, monospace" font-size="11" fill="#5f5f5f">uv add openai-agents</text>
    <text x="520" y="136" font-size="11" fill="#5f5f5f">OPENAI_API_KEY 환경 변수만 있으면 시작</text>

    <!-- 1 -->
    <circle cx="36" cy="192" r="9" fill="#0f7b6c"/>
    <text x="36" y="196" font-size="10" text-anchor="middle" fill="#ffffff">1</text>
    <text x="56" y="196" fill="#1f1f1f">에이전트와 실행</text>
    <text x="210" y="186" font-family="Menlo, Consolas, monospace" font-size="11" fill="#1f1f1f">Agent(name, instructions)</text>
    <text x="210" y="204" font-family="Menlo, Consolas, monospace" font-size="11" fill="#1f1f1f">Runner.run_sync(agent, prompt)</text>
    <text x="520" y="196" font-size="11" fill="#5f5f5f">지시문대로 답하는 루프 하나</text>

    <!-- 2 -->
    <circle cx="36" cy="256" r="9" fill="#0f7b6c"/>
    <text x="36" y="260" font-size="10" text-anchor="middle" fill="#ffffff">2</text>
    <text x="56" y="260" fill="#1f1f1f">호스팅 도구</text>
    <text x="210" y="260" font-family="Menlo, Consolas, monospace" font-size="11" fill="#1f1f1f">tools=[WebSearchTool()]</text>
    <text x="520" y="252" font-size="11" fill="#5f5f5f">웹 검색. 언제 쓸지는</text>
    <text x="520" y="268" font-size="11" fill="#5f5f5f">모델이 정한다</text>

    <!-- 3 -->
    <circle cx="36" cy="324" r="9" fill="#0f7b6c"/>
    <text x="36" y="328" font-size="10" text-anchor="middle" fill="#ffffff">3</text>
    <text x="56" y="328" fill="#1f1f1f">내 함수를 도구로</text>
    <text x="210" y="316" font-family="Menlo, Consolas, monospace" font-size="11" fill="#1f1f1f">@tool</text>
    <text x="210" y="334" font-family="Menlo, Consolas, monospace" font-size="11" fill="#1f1f1f">def calculate_total(price, quantity)</text>
    <text x="520" y="320" font-size="11" fill="#5f5f5f">함수 이름·타입 힌트·docstring으로</text>
    <text x="520" y="336" font-size="11" fill="#5f5f5f">스키마 자동 생성 (예: 14 × $2.49)</text>

    <!-- 4 -->
    <circle cx="36" cy="392" r="9" fill="#0f7b6c"/>
    <text x="36" y="396" font-size="10" text-anchor="middle" fill="#ffffff">4</text>
    <text x="56" y="396" fill="#1f1f1f">대화 기억</text>
    <text x="210" y="384" font-family="Menlo, Consolas, monospace" font-size="11" fill="#1f1f1f">SQLiteSession("user_1",</text>
    <text x="230" y="402" font-family="Menlo, Consolas, monospace" font-size="11" fill="#1f1f1f">"conversations.db")</text>
    <text x="520" y="388" font-size="11" fill="#5f5f5f">재시작해도 이전 대화 유지</text>
    <text x="520" y="404" font-size="11" fill="#5f5f5f">Redis·SQLAlchemy·MongoDB도 가능</text>

    <!-- 5 -->
    <circle cx="36" cy="456" r="9" fill="#ffffff" stroke="#0f7b6c"/>
    <text x="36" y="460" font-size="10" text-anchor="middle" fill="#0f7b6c">5</text>
    <text x="56" y="460" fill="#1f1f1f">트레이싱</text>
    <text x="210" y="460" font-size="11" fill="#9a9a9a">(코드 없음, 기본 켜짐)</text>
    <text x="520" y="460" font-size="11" fill="#5f5f5f">모델 호출·도구 사용을 대시보드에서 확인</text>
  </g>
  <line x1="36" y1="141" x2="36" y2="447" stroke="#e2e2e2"/>

  <line x1="24" y1="492" x2="736" y2="492" stroke="#e2e2e2"/>
  <text x="24" y="518" font-size="11" fill="#5f5f5f">가드레일과 핸드오프(다른 에이전트에 넘기기)는 이 실습에 없다. 다음 단계로 남겨 둔 것.</text>
  <text x="24" y="538" font-size="11" fill="#5f5f5f">"작게 시작해 워크플로 하나를 쓸모 있게 만들고, 복잡함은 정말 필요할 때만 더하라."</text>
</svg>
