<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0.5" y="0.5" width="759" height="539" rx="8" fill="#ffffff" stroke="#e6e6e6"/>
  <text x="24" y="38" font-size="17" font-weight="700" fill="#1f1f1f">자동화의 역설: 사람에게 남는 장애가 가장 어렵다</text>
  <text x="24" y="58" font-size="12" fill="#8a8a8a">AI가 쉬운 장애를 맡을수록, 어려운 장애를 풀 감각을 기를 기회가 줄어든다 (Bainbridge, 1983)</text>

  <!-- tiers -->
  <text x="24" y="96" font-size="11" font-weight="600" fill="#9a9a9a">PagerDuty의 3단계 구분: 누가 주도하나</text>
  <line x1="24" y1="104" x2="736" y2="104" stroke="#e2e2e2"/>
  <g font-size="12">
    <text x="24" y="136" fill="#1f1f1f">Tier 1</text>
    <text x="24" y="152" font-size="11" fill="#9a9a9a">알려진 문제·해법</text>
    <rect x="150" y="124" width="420" height="24" fill="#cfcfcf"/>
    <text x="160" y="141" font-size="11" fill="#1f1f1f">완전 자동화 (런북 실행, 파드 재시작, 확장)</text>

    <text x="24" y="190" fill="#1f1f1f">Tier 2</text>
    <text x="24" y="206" font-size="11" fill="#9a9a9a">부분적으로 이해됨</text>
    <rect x="150" y="178" width="280" height="24" fill="#cfcfcf"/>
    <rect x="430" y="178" width="140" height="24" fill="#0f7b6c" opacity="0.55"/>
    <text x="160" y="195" font-size="11" fill="#1f1f1f">AI가 해결책 추천</text>
    <text x="440" y="195" font-size="11" fill="#ffffff">사람이 검증</text>

    <text x="24" y="244" fill="#1f1f1f">Tier 3</text>
    <text x="24" y="260" font-size="11" fill="#9a9a9a">새롭고 복잡한 연쇄 장애</text>
    <rect x="150" y="232" width="100" height="24" fill="#cfcfcf"/>
    <rect x="250" y="232" width="320" height="24" fill="#0f7b6c"/>
    <text x="160" y="249" font-size="11" fill="#1f1f1f">AI는 맥락</text>
    <text x="260" y="249" font-size="11" fill="#ffffff">사람이 주도</text>
  </g>
  <g font-size="11" fill="#5f5f5f">
    <text x="596" y="141">연습 기회</text>
    <text x="596" y="157">사라짐</text>
    <text x="596" y="249">직관이 필요한 곳</text>
  </g>
  <path d="M600,168 V224" stroke="#9a9a9a" fill="none" stroke-dasharray="3 3"/>
  <text x="24" y="292" font-size="11" fill="#5f5f5f">사람이 Tier 3에만 참여하면, 그 직관을 어디서 쌓느냐는 질문이 남는다. 막대 길이는 개념도.</text>

  <!-- three lost practices -->
  <text x="24" y="334" font-size="11" font-weight="600" fill="#9a9a9a">하나씩은 생산성 향상, 합치면 전문성 약화</text>
  <line x1="24" y1="342" x2="736" y2="342" stroke="#e2e2e2"/>
  <g font-size="12">
    <text x="24" y="372" fill="#1f1f1f">원시 로그 읽기</text>
    <text x="24" y="390" font-size="11" fill="#5f5f5f">→ AI 요약을 읽음</text>
    <line x1="200" y1="358" x2="200" y2="396" stroke="#e2e2e2"/>
    <text x="220" y="372" fill="#1f1f1f">원인 가설 세우기</text>
    <text x="220" y="390" font-size="11" fill="#5f5f5f">→ AI 추천 원인을 검토함</text>
    <line x1="410" y1="358" x2="410" y2="396" stroke="#e2e2e2"/>
    <text x="430" y="372" fill="#1f1f1f">구조의 정신 모형</text>
    <text x="430" y="390" font-size="11" fill="#5f5f5f">→ AI가 그린 의존성 그래프를 봄</text>
  </g>

  <!-- endoscopy dumbbell -->
  <text x="24" y="434" font-size="11" font-weight="600" fill="#9a9a9a">다른 분야의 관찰: AI 보조를 쓴 뒤 AI 없이 용종을 찾은 비율 (내시경 연구)</text>
  <line x1="24" y1="442" x2="736" y2="442" stroke="#e2e2e2"/>
  <line x1="150" y1="488" x2="710" y2="488" stroke="#e2e2e2"/>
  <g font-size="10" fill="#9a9a9a" text-anchor="middle">
    <text x="150" y="508">15%</text><text x="337" y="508">20%</text><text x="523" y="508">25%</text><text x="710" y="508">30%</text>
  </g>
  <line x1="411.3" y1="488" x2="635.3" y2="488" stroke="#9a9a9a" stroke-width="3"/>
  <circle cx="635.3" cy="488" r="8" fill="#b8b8b8"/>
  <circle cx="411.3" cy="488" r="8" fill="#0f7b6c"/>
  <text x="635.3" y="472" font-size="12" text-anchor="middle" fill="#5f5f5f">사용 전 28%</text>
  <text x="411.3" y="472" font-size="12" text-anchor="middle" fill="#0f7b6c" font-weight="600">22%</text>
  <text x="24" y="492" font-size="12" fill="#1f1f1f">탐지율</text>
  <text x="24" y="526" font-size="11" fill="#5f5f5f">대응책은 AI를 끄는 것이 아니라, AI가 풀 수 있는 장애 일부를 일부러 사람이 직접 푸는 연습으로 남겨 두는 것.</text>
</svg>
