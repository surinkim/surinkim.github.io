<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="760" height="520" rx="12" fill="#ffffff" stroke="#e3e3e3"/>
  <text x="24" y="36" font-size="17" font-weight="700" fill="#222">노드 메모리 압박 대응의 핵심</text>
  <text x="24" y="56" font-size="12" fill="#888">경보 셋은 서로 다른 상황을 놓친다 → 모두 켜 두고, soft 축출 유예를 마지막 안전판으로 둔다</text>

  <!-- three signal cards -->
  <g font-size="12">
    <rect x="24" y="76" width="228" height="150" rx="10" fill="#eef8f2" stroke="#b9e0c8"/>
    <text x="40" y="102" font-size="14" font-weight="700" fill="#22804e">① 이상 탐지</text>
    <text x="40" y="126" fill="#22804e" font-weight="700">잡는 것</text>
    <text x="40" y="144" fill="#333">서서히 줄어드는 메모리</text>
    <text x="40" y="160" fill="#777" font-size="11">실습: MemoryPressure보다 2분 31초 먼저</text>
    <text x="40" y="186" fill="#b03a3a" font-weight="700">놓치는 것</text>
    <text x="40" y="204" fill="#333">한 번에 빠지는 하락</text>
    <text x="40" y="220" fill="#777" font-size="11">실습: 점수 4.2 (경보 기준 25)</text>

    <rect x="266" y="76" width="228" height="150" rx="10" fill="#fdf5e8" stroke="#efd29b"/>
    <text x="282" y="102" font-size="14" font-weight="700" fill="#b06d0b">② 여유 경고</text>
    <text x="282" y="126" fill="#22804e" font-weight="700">잡는 것</text>
    <text x="282" y="144" fill="#333">임계값에 다가가는 노드</text>
    <text x="282" y="160" fill="#777" font-size="11">임계값 + 여유 폭 아래로 내려가면</text>
    <text x="282" y="186" fill="#b03a3a" font-weight="700">놓치는 것</text>
    <text x="282" y="204" fill="#333">여유 폭보다 큰 한 번의 하락</text>
    <text x="282" y="220" fill="#777" font-size="11">실습: 여유 0.5GiB에 1GiB 하락 → 41초 늦음</text>

    <rect x="508" y="76" width="228" height="150" rx="10" fill="#fcefef" stroke="#eab9b9"/>
    <text x="524" y="102" font-size="14" font-weight="700" fill="#b03a3a">③ MemoryPressure</text>
    <text x="524" y="126" fill="#22804e" font-weight="700">잡는 것</text>
    <text x="524" y="144" fill="#333">축출 임계값을 실제로 넘음</text>
    <text x="524" y="160" fill="#777" font-size="11">놓치는 경우 없음</text>
    <text x="524" y="186" fill="#b03a3a" font-weight="700">한계</text>
    <text x="524" y="204" fill="#333">울릴 때는 이미 축출 카운트다운</text>
    <text x="524" y="220" fill="#777" font-size="11">hard 임계값만 있으면 즉시 축출</text>
  </g>

  <!-- arrow -->
  <path d="M380,234 V256" stroke="#999" stroke-width="2"/>
  <path d="M373,250 L380,260 L387,250" fill="none" stroke="#999" stroke-width="2"/>

  <!-- backstop -->
  <rect x="24" y="266" width="712" height="128" rx="10" fill="#f3f5fb" stroke="#c9d3ea"/>
  <text x="40" y="292" font-size="14" font-weight="700" fill="#2b4f9e">마지막 안전판: soft 축출 유예 (실습 5분)</text>
  <text x="40" y="310" font-size="11" fill="#666">임계값을 넘어도 유예 시간 동안 기다리고, 그 안에 메모리가 회복되면 축출하지 않는다</text>

  <g font-size="12">
    <text x="40" y="342" fill="#333" font-weight="700">1차</text>
    <rect x="80" y="330" width="420" height="18" rx="4" fill="#dfe6f5"/>
    <text x="88" y="343" font-size="11" fill="#2b4f9e">MemoryPressure → 대응 없음 (4분 58초)</text>
    <rect x="500" y="330" width="16" height="18" rx="3" fill="#c03030"/>
    <text x="524" y="343" fill="#c03030" font-weight="700">유예 소진 → NGINX 축출, 장애</text>

    <text x="40" y="374" fill="#333" font-weight="700">2차</text>
    <rect x="80" y="362" width="420" height="18" rx="4" fill="#dfe6f5"/>
    <rect x="80" y="362" width="260" height="18" rx="4" fill="#b9c9ec"/>
    <text x="88" y="375" font-size="11" fill="#2b4f9e">MemoryPressure → 약 3분 만에 부하 제거</text>
    <circle cx="340" cy="371" r="6" fill="#22804e"/>
    <text x="524" y="375" fill="#22804e" font-weight="700">유예 안에 회복 → 축출 없음</text>
  </g>

  <!-- rules -->
  <text x="24" y="426" font-size="14" font-weight="700" fill="#222">설정할 때 기준 두 가지</text>
  <rect x="24" y="438" width="350" height="60" rx="8" fill="#f6f7f9"/>
  <text x="40" y="462" font-size="12" font-weight="700" fill="#333">유예 시간</text>
  <text x="40" y="482" font-size="12" fill="#444">≥ 경보 전달 + 확인 + 조치에 걸리는 시간</text>
  <rect x="386" y="438" width="350" height="60" rx="8" fill="#f6f7f9"/>
  <text x="402" y="462" font-size="12" font-weight="700" fill="#333">여유 경고 폭</text>
  <text x="402" y="482" font-size="12" fill="#444">&gt; 한 평가 주기 동안 빠질 수 있는 메모리</text>
</svg>
