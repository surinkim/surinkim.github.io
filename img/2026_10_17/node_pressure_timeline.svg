<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0" y="0" width="760" height="430" rx="12" fill="#ffffff" stroke="#e3e3e3"/>

  <text x="24" y="34" font-size="17" font-weight="700" fill="#222">노드 메모리가 줄어들 때 경보가 울리는 순서</text>
  <text x="24" y="54" font-size="12" fill="#888">Elastic 실습(kind 클러스터, soft 축출 임계값 6GiB) 개념도 · 시각은 첫 요청 실패 기준</text>

  <!-- axes -->
  <text x="24" y="86" font-size="11" fill="#888">가용 메모리</text>
  <line x1="80" y1="92" x2="80" y2="290" stroke="#bbb"/>
  <line x1="80" y1="290" x2="730" y2="290" stroke="#bbb"/>
  <text x="730" y="284" font-size="11" fill="#888" text-anchor="end">시간 →</text>

  <!-- thresholds -->
  <line x1="80" y1="190" x2="730" y2="190" stroke="#e8a33d" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="88" y="184" font-size="11" fill="#c47f12">여유 경고선 6.5GiB</text>
  <line x1="80" y1="232" x2="730" y2="232" stroke="#d64545" stroke-width="2"/>
  <text x="88" y="226" font-size="11" fill="#c03030">축출 임계값 6GiB</text>

  <!-- memory line -->
  <path d="M80,108 H133 L141,132 H373 L383,262 H730" fill="none" stroke="#2f6fd6" stroke-width="3" stroke-linejoin="round"/>
  <text x="146" y="150" font-size="11" fill="#2f6fd6">stress 파드 256MiB 할당</text>
  <text x="300" y="250" font-size="11" fill="#2f6fd6" text-anchor="end">4분 30초 뒤 1GiB 추가 할당 →</text>

  <!-- headroom warning marker -->
  <circle cx="437" cy="262" r="5" fill="#e8a33d"/>
  <text x="445" y="254" font-size="11" fill="#c47f12">여유 경고 (+41초, 1GiB가 두 선을 한 번에 넘음)</text>

  <!-- event markers -->
  <g font-size="12">
    <line x1="268" y1="92" x2="268" y2="290" stroke="#2f9e62" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="268" cy="132" r="6" fill="#2f9e62"/>
    <text x="268" y="312" fill="#2f9e62" font-weight="700" text-anchor="middle">① 이상 탐지</text>
    <text x="268" y="328" fill="#555" text-anchor="middle">−7분 29초</text>

    <line x1="401" y1="92" x2="401" y2="290" stroke="#c03030" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="401" cy="262" r="6" fill="#c03030"/>
    <text x="401" y="312" fill="#c03030" font-weight="700" text-anchor="middle">② MemoryPressure</text>
    <text x="401" y="328" fill="#555" text-anchor="middle">−4분 58초</text>

    <line x1="667" y1="92" x2="667" y2="290" stroke="#555" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="667" cy="262" r="6" fill="#555"/>
    <text x="667" y="312" fill="#333" font-weight="700" text-anchor="middle">③ 첫 요청 실패</text>
    <text x="667" y="328" fill="#555" text-anchor="middle">0</text>
  </g>

  <!-- grace period bracket -->
  <path d="M405,102 V96 H663 V102" fill="none" stroke="#999"/>
  <text x="534" y="90" font-size="11" fill="#777" text-anchor="middle">soft 축출 유예 5분</text>

  <!-- eviction callout -->
  <rect x="500" y="118" width="186" height="40" rx="6" fill="#fdecec" stroke="#e7b3b3"/>
  <text x="593" y="135" font-size="12" fill="#a82828" font-weight="700" text-anchor="middle">NGINX 파드 축출 → 서비스 중단</text>
  <text x="593" y="150" font-size="11" fill="#a82828" text-anchor="middle">9MiB 사용 · request 없음 · 우선순위 낮음</text>
  <line x1="650" y1="158" x2="666" y2="255" stroke="#e7b3b3" stroke-width="1.5"/>

  <!-- eviction order -->
  <rect x="24" y="350" width="712" height="62" rx="8" fill="#f6f7f9"/>
  <text x="40" y="373" font-size="12" font-weight="700" fill="#333">kubelet이 축출할 파드를 고르는 순서</text>
  <text x="40" y="397" font-size="12" fill="#444">① 사용량이 request를 넘었나  →  ② 파드 우선순위가 낮은가  →  ③ request를 얼마나 넘었나</text>
  <text x="720" y="397" font-size="11" fill="#999" text-anchor="end">메모리를 늘린 파드가 먼저 나가는 게 아니다</text>
</svg>
