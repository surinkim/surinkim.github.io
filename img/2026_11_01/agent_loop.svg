<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f7b6c"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="759" height="609" rx="8" fill="#ffffff" stroke="#e6e6e6"/>
  <text x="24" y="38" font-size="17" font-weight="700" fill="#1f1f1f">에이전트 루프: 모델은 고르고, 하네스는 실행한다</text>
  <text x="24" y="58" font-size="12" fill="#8a8a8a">agent-loop-demo의 main() 한 바퀴. 모델을 한 번 부르는 것이 한 스텝이다</text>

  <!-- lanes -->
  <g font-size="11" font-weight="600" fill="#9a9a9a">
    <text x="24" y="96">하네스 (main.go)</text>
    <text x="470" y="96">모델 (Ollama)</text>
    <text x="630" y="96">도구 (Go 함수)</text>
  </g>
  <line x1="24" y1="104" x2="440" y2="104" stroke="#e2e2e2"/>
  <line x1="470" y1="104" x2="600" y2="104" stroke="#e2e2e2"/>
  <line x1="630" y1="104" x2="736" y2="104" stroke="#e2e2e2"/>

  <g font-size="12" fill="#1f1f1f">
    <!-- A -->
    <rect x="60" y="122" width="280" height="40" fill="#ffffff" stroke="#b8b8b8"/>
    <text x="200" y="147" text-anchor="middle">대화 시작: [system, user]</text>
    <line x1="200" y1="162" x2="200" y2="188" stroke="#9a9a9a" marker-end="url(#a)"/>

    <!-- B -->
    <rect x="60" y="190" width="280" height="44" fill="#ffffff" stroke="#b8b8b8"/>
    <text x="200" y="208" text-anchor="middle">/api/chat 호출</text>
    <text x="200" y="225" text-anchor="middle" font-size="11" fill="#5f5f5f">지금까지의 대화 전체 + 도구 정의</text>
    <line x1="340" y1="212" x2="468" y2="212" stroke="#9a9a9a" marker-end="url(#a)"/>

    <!-- model -->
    <rect x="470" y="186" width="130" height="104" fill="#f4f4f4" stroke="#cfcfcf"/>
    <text x="535" y="214" text-anchor="middle" font-weight="600">다음 할 일을 고른다</text>
    <text x="535" y="238" text-anchor="middle" font-size="11" fill="#5f5f5f">답을 쓰거나,</text>
    <text x="535" y="254" text-anchor="middle" font-size="11" fill="#5f5f5f">도구 호출을 요청하는</text>
    <text x="535" y="270" text-anchor="middle" font-size="11" fill="#5f5f5f">JSON을 쓴다</text>
    <line x1="470" y1="272" x2="342" y2="272" stroke="#9a9a9a" marker-end="url(#a)"/>

    <!-- C -->
    <rect x="60" y="252" width="280" height="40" fill="#ffffff" stroke="#b8b8b8"/>
    <text x="200" y="277" text-anchor="middle">모델 응답을 대화에 붙인다</text>
    <line x1="200" y1="292" x2="200" y2="314" stroke="#9a9a9a" marker-end="url(#a)"/>

    <!-- D decision -->
    <polygon points="200,316 300,346 200,376 100,346" fill="#ffffff" stroke="#b8b8b8"/>
    <text x="200" y="350" text-anchor="middle">tool_calls가 있나?</text>
    <line x1="300" y1="346" x2="356" y2="346" stroke="#9a9a9a" marker-end="url(#a)"/>
    <text x="328" y="338" text-anchor="middle" font-size="11" fill="#9a9a9a">없음</text>
    <rect x="358" y="326" width="82" height="40" fill="#ffffff" stroke="#1f1f1f"/>
    <text x="399" y="351" text-anchor="middle" font-weight="600">최종 답, 끝</text>
    <line x1="200" y1="376" x2="200" y2="406" stroke="#9a9a9a" marker-end="url(#a)"/>
    <text x="210" y="396" font-size="11" fill="#9a9a9a">있음</text>

    <!-- F -->
    <rect x="60" y="408" width="280" height="44" fill="#ffffff" stroke="#b8b8b8"/>
    <text x="200" y="426" text-anchor="middle">요청받은 도구를 실행한다</text>
    <text x="200" y="443" text-anchor="middle" font-size="11" fill="#5f5f5f">run(name, args)</text>
    <line x1="340" y1="430" x2="628" y2="430" stroke="#9a9a9a" marker-end="url(#a)"/>

    <!-- tools -->
    <rect x="630" y="404" width="106" height="120" fill="#ffffff" stroke="#cfcfcf"/>
    <g font-size="11" fill="#5f5f5f" font-family="SFMono-Regular, Menlo, monospace">
      <text x="642" y="430">list_servers</text>
      <text x="642" y="452">get_metrics</text>
      <text x="642" y="474">get_deploys</text>
    </g>
    <line x1="630" y1="500" x2="342" y2="500" stroke="#9a9a9a" marker-end="url(#a)"/>
    <text x="486" y="492" text-anchor="middle" font-size="11" fill="#9a9a9a">결과 또는 에러</text>

    <!-- G -->
    <rect x="60" y="478" width="280" height="44" fill="#ffffff" stroke="#b8b8b8"/>
    <text x="200" y="496" text-anchor="middle">도구 결과를 대화에 붙인다</text>
    <text x="200" y="513" text-anchor="middle" font-size="11" fill="#5f5f5f">에러도 결과로 붙여서 돌려준다</text>
  </g>

  <!-- loop back -->
  <path d="M60,500 L46,500 L46,212 L58,212" fill="none" stroke="#0f7b6c" stroke-width="2" marker-end="url(#g)"/>
  <text x="36" y="366" font-size="11" font-weight="600" fill="#0f7b6c" transform="rotate(-90 36 366)" text-anchor="middle">다음 스텝</text>

  <!-- guards -->
  <line x1="24" y1="550" x2="736" y2="550" stroke="#e2e2e2"/>
  <text x="24" y="574" font-size="12" fill="#1f1f1f">모델이 하는 일은 회색 상자 하나다. 대화 보관, 도구 실행, 멈출 조건, 에러 처리는 모두 하네스 코드다.</text>
  <text x="24" y="594" font-size="12" fill="#0f7b6c">하네스의 안전장치: 스텝이 max-steps를 넘으면 멈춘다 · 도구 에러를 모델에게 돌려준다</text>
</svg>
