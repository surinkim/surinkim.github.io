<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect x="0.5" y="0.5" width="759" height="599" rx="8" fill="#ffffff" stroke="#e6e6e6"/>
  <text x="24" y="38" font-size="17" font-weight="700" fill="#1f1f1f">스텝마다 대화 전체를 다시 보낸다</text>
  <text x="24" y="58" font-size="12" fill="#8a8a8a">llama3.2:3b, 하네스 장치를 모두 켠 실행. 입력 토큰은 Ollama가 돌려준 prompt_eval_count</text>

  <!-- Panel A -->
  <text x="24" y="96" font-size="11" font-weight="600" fill="#9a9a9a">서버 수별 입력 토큰 (temperature 0)</text>
  <line x1="24" y1="104" x2="736" y2="104" stroke="#e2e2e2"/>

  <g font-size="10" fill="#9a9a9a" text-anchor="end">
    <text x="80" y="263">0</text>
    <text x="80" y="188">1,000</text>
    <text x="80" y="113">2,000</text>
  </g>
  <line x1="90" y1="260" x2="700" y2="260" stroke="#cfcfcf"/>
  <line x1="90" y1="185" x2="700" y2="185" stroke="#eeeeee"/>
  <line x1="90" y1="110" x2="700" y2="110" stroke="#eeeeee"/>

  <polyline points="90,232 242.5,230.8 395,192.7 547.5,186.2 700,176.1" fill="none" stroke="#cfcfcf" stroke-width="2"/>
  <polyline points="90,232 242.5,230.7 395,200.2 547.5,176.9 700,156.9" fill="none" stroke="#9a9a9a" stroke-width="2"/>
  <polyline points="90,232 242.5,230.7 395,198.1 547.5,151.2 700,131.2" fill="none" stroke="#0f7b6c" stroke-width="2"/>
  <g fill="#0f7b6c"><circle cx="547.5" cy="151.2" r="3"/><circle cx="700" cy="131.2" r="3"/></g>
  <g fill="#9a9a9a"><circle cx="547.5" cy="176.9" r="3"/><circle cx="700" cy="156.9" r="3"/></g>
  <g fill="#cfcfcf"><circle cx="547.5" cy="186.2" r="3"/><circle cx="700" cy="176.1" r="3"/></g>

  <g font-size="11">
    <text x="708" y="135" fill="#0f7b6c" font-weight="600">21대</text>
    <text x="708" y="160" fill="#5f5f5f">14대</text>
    <text x="708" y="180" fill="#9a9a9a">7대</text>
  </g>
  <text x="692" y="125" font-size="10" fill="#0f7b6c" text-anchor="end">1,718</text>
  <text x="692" y="150" font-size="10" fill="#5f5f5f" text-anchor="end">1,375</text>
  <text x="692" y="192" font-size="10" fill="#9a9a9a" text-anchor="end">1,119</text>

  <g font-size="11" fill="#5f5f5f" text-anchor="middle">
    <text x="90" y="280">1</text><text x="90" y="295" font-size="10" fill="#9a9a9a">도구 호출</text>
    <text x="242.5" y="280">2</text><text x="242.5" y="295" font-size="10" fill="#9a9a9a">답 → 하네스가 돌려보냄</text>
    <text x="395" y="280">3</text><text x="395" y="295" font-size="10" fill="#9a9a9a">남은 서버를 한꺼번에 호출</text>
    <text x="547.5" y="280">4</text><text x="547.5" y="295" font-size="10" fill="#9a9a9a">결과를 받고 답</text>
    <text x="700" y="280">5</text><text x="700" y="295" font-size="10" fill="#9a9a9a">형식 지정 답</text>
  </g>

  <!-- Panel B -->
  <text x="24" y="336" font-size="11" font-weight="600" fill="#9a9a9a">21대, seed 2: 검증과 모델이 맞서다 최대 스텝(15)에서 멈춤</text>
  <line x1="24" y1="344" x2="736" y2="344" stroke="#e2e2e2"/>

  <g font-size="10" fill="#9a9a9a" text-anchor="end">
    <text x="80" y="513">0</text>
    <text x="80" y="442">2,000</text>
  </g>
  <line x1="90" y1="510" x2="700" y2="510" stroke="#cfcfcf"/>
  <line x1="90" y1="438.9" x2="700" y2="438.9" stroke="#eeeeee"/>
  <line x1="90" y1="364.4" x2="700" y2="364.4" stroke="#0f7b6c" stroke-dasharray="4 3"/>
  <text x="94" y="358" font-size="11" fill="#0f7b6c">Ollama 기본 컨텍스트 4,096토큰. 넘으면 앞부분이 잘린다</text>

  <polyline points="90,496.7 133.6,497.2 177.1,481.8 220.7,482.1 264.3,456.9 307.9,460.9 351.4,431.3 395,439.1 438.6,414 482.1,421.8 525.7,396.6 569.3,401.3 612.9,376.2 656.4,384 700,368.7" fill="none" stroke="#5f5f5f" stroke-width="2"/>
  <g fill="#5f5f5f">
    <circle cx="90" cy="496.7" r="2.5"/><circle cx="133.6" cy="497.2" r="2.5"/><circle cx="177.1" cy="481.8" r="2.5"/><circle cx="220.7" cy="482.1" r="2.5"/><circle cx="264.3" cy="456.9" r="2.5"/><circle cx="307.9" cy="460.9" r="2.5"/><circle cx="351.4" cy="431.3" r="2.5"/><circle cx="395" cy="439.1" r="2.5"/><circle cx="438.6" cy="414" r="2.5"/><circle cx="482.1" cy="421.8" r="2.5"/><circle cx="525.7" cy="396.6" r="2.5"/><circle cx="569.3" cy="401.3" r="2.5"/><circle cx="612.9" cy="376.2" r="2.5"/><circle cx="656.4" cy="384" r="2.5"/><circle cx="700" cy="368.7" r="2.5"/>
  </g>
  <text x="692" y="386" font-size="10" fill="#5f5f5f" text-anchor="end">3,975</text>
  <line x1="712" y1="364" x2="712" y2="510" stroke="#1f1f1f"/>
  <text x="718" y="440" font-size="10" fill="#1f1f1f">멈춤</text>

  <g font-size="10" fill="#9a9a9a" text-anchor="middle">
    <text x="90" y="526">1</text><text x="307.9" y="526">6</text><text x="525.7" y="526">11</text><text x="700" y="526">15 스텝</text>
  </g>
  <text x="420" y="480" font-size="10" fill="#9a9a9a">짝수 스텝: 답 → 미확인 21대라며 돌려보냄</text>
  <text x="420" y="494" font-size="10" fill="#9a9a9a">홀수 스텝: 같은 호출 반복 → 중복 차단</text>

  <line x1="24" y1="550" x2="736" y2="550" stroke="#e2e2e2"/>
  <text x="24" y="570" font-size="11" fill="#5f5f5f">톱니 모양은 llama3.2 템플릿 때문이다. 마지막 메시지가 사용자 메시지일 때만 도구 정의를 넣어서,</text>
  <text x="24" y="587" font-size="11" fill="#5f5f5f">도구 결과로 끝나는 스텝은 메시지가 늘어도 입력 토큰이 줄어든다.</text>
</svg>
